<!DOCTYPE html>
<html lang="en" data-pengui-medium="print">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      /* Soul tokens are injected here by the recipe generator */
    }

    html, body { margin: 0; padding: 0; }


    * { box-sizing: border-box; }

    .slide {
      width: 1240px;
      height: 1754px;
      padding: var(--space-safe-area);
      background: var(--color-canvas);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-body);
      font-weight: var(--weight-normal);
      line-height: var(--leading-body);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Page header */
    .page-header {
      margin-bottom: var(--space-xl);
      padding-bottom: var(--space-lg);
      border-bottom: var(--border-width) solid var(--color-border);
      flex-shrink: 0;
    }

    .page-label {
      font-family: var(--font-mono);
      font-size: var(--text-caption);
      font-weight: var(--weight-medium);
      color: var(--color-accent-primary);
      letter-spacing: var(--letter-spacing-heading);
      text-transform: uppercase;
      margin-bottom: var(--space-sm);
    }

    .page-heading {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: var(--weight-bold);
      letter-spacing: var(--letter-spacing-heading);
      line-height: var(--line-height-heading);
      color: var(--color-text-primary);
    }

    /* Optional context paragraph */
    .context-text {
      font-size: var(--text-body);
      color: var(--color-text-secondary);
      line-height: var(--leading-body);
      margin-bottom: var(--space-xxl);
      flex-shrink: 0;
    }

    /* Timeline outer wrapper — fills remaining height */
    .timeline-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    /* SVG timeline — horizontal axis with events above/below */
    .timeline-svg-container {
      width: 100%;
    }

    .timeline-svg {
      width: 100%;
      overflow: visible;
    }
  </style>
</head>
<body>
  <!-- @slide-meta {"title":"Timeline","type":"timeline","narrative":"Horizontal timeline with labeled events along a central axis. Events alternate above and below the axis line. Uses soul tokens for colors. Adjust the number and position of events to suit the content.","tags":["timeline","history","chronology","events","print"]} -->
  <div class="slide">
    <!-- Page header -->
    <div class="page-header">
      <div class="page-label">Timeline</div>
      <h1 class="page-heading">Key Milestones</h1>
    </div>

    <!-- Optional context paragraph -->
    <p class="context-text">
      The timeline below charts six significant milestones in the development of the subject.
      Adjust dates and descriptions to match the actual historical or project sequence.
    </p>

    <!-- Timeline diagram -->
    <div class="timeline-wrapper">
      <div class="timeline-svg-container">
        <!--
          Horizontal timeline: axis at y=220, events alternate above (labels at y≈100–170)
          and below (labels at y≈270–340). Six labeled nodes evenly spaced.
          All colors via soul tokens. viewBox coordinates are geometry, not styling.
        -->
        <svg
          class="timeline-svg"
          viewBox="0 0 1048 440"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Horizontal timeline with six milestone events"
          role="img"
        >
          <style>
            .tl-axis      { stroke: var(--color-border); stroke-width: 2; }
            .tl-stem      { stroke: var(--color-border); stroke-width: 1.5; stroke-dasharray: 4 3; }
            .tl-dot       { fill: var(--color-accent-primary); }
            .tl-dot-alt   { fill: var(--color-accent-secondary); }
            .tl-label-date { font-family: var(--font-mono); font-size: var(--text-caption); font-weight: var(--weight-bold); fill: var(--color-accent-primary); }
            .tl-label-title { font-family: var(--font-display); font-size: var(--text-body); font-weight: var(--weight-medium); fill: var(--color-text-primary); }
            .tl-label-desc  { font-family: var(--font-body); font-size: var(--text-caption); fill: var(--color-text-secondary); }
          </style>

          <!-- Main horizontal axis line -->
          <line class="tl-axis" x1="40" y1="220" x2="1008" y2="220" />

          <!--
            6 events: x positions at ~80, 240, 400, 560, 720, 880
            Events at x=80, 400, 720 are ABOVE the axis (label above, dot on axis).
            Events at x=240, 560, 880 are BELOW the axis.
          -->

          <!-- Event 1 — ABOVE (x=80) -->
          <line class="tl-stem" x1="80" y1="220" x2="80" y2="120" />
          <circle class="tl-dot" cx="80" cy="220" r="8" />
          <text class="tl-label-date" x="80" y="108" text-anchor="middle">1920</text>
          <text class="tl-label-title" x="80" y="90" text-anchor="middle">Event One</text>
          <text class="tl-label-desc" x="80" y="74" text-anchor="middle">Founding moment</text>

          <!-- Event 2 — BELOW (x=240) -->
          <line class="tl-stem" x1="240" y1="220" x2="240" y2="320" />
          <circle class="tl-dot-alt" cx="240" cy="220" r="8" />
          <text class="tl-label-date" x="240" y="340" text-anchor="middle">1945</text>
          <text class="tl-label-title" x="240" y="358" text-anchor="middle">Event Two</text>
          <text class="tl-label-desc" x="240" y="374" text-anchor="middle">Pivotal shift</text>

          <!-- Event 3 — ABOVE (x=400) -->
          <line class="tl-stem" x1="400" y1="220" x2="400" y2="120" />
          <circle class="tl-dot" cx="400" cy="220" r="8" />
          <text class="tl-label-date" x="400" y="108" text-anchor="middle">1969</text>
          <text class="tl-label-title" x="400" y="90" text-anchor="middle">Event Three</text>
          <text class="tl-label-desc" x="400" y="74" text-anchor="middle">Major breakthrough</text>

          <!-- Event 4 — BELOW (x=560) -->
          <line class="tl-stem" x1="560" y1="220" x2="560" y2="320" />
          <circle class="tl-dot-alt" cx="560" cy="220" r="8" />
          <text class="tl-label-date" x="560" y="340" text-anchor="middle">1991</text>
          <text class="tl-label-title" x="560" y="358" text-anchor="middle">Event Four</text>
          <text class="tl-label-desc" x="560" y="374" text-anchor="middle">Global adoption</text>

          <!-- Event 5 — ABOVE (x=720) -->
          <line class="tl-stem" x1="720" y1="220" x2="720" y2="120" />
          <circle class="tl-dot" cx="720" cy="220" r="8" />
          <text class="tl-label-date" x="720" y="108" text-anchor="middle">2008</text>
          <text class="tl-label-title" x="720" y="90" text-anchor="middle">Event Five</text>
          <text class="tl-label-desc" x="720" y="74" text-anchor="middle">Paradigm change</text>

          <!-- Event 6 — BELOW (x=880) -->
          <line class="tl-stem" x1="880" y1="220" x2="880" y2="320" />
          <circle class="tl-dot-alt" cx="880" cy="220" r="8" />
          <text class="tl-label-date" x="880" y="340" text-anchor="middle">2024</text>
          <text class="tl-label-title" x="880" y="358" text-anchor="middle">Event Six</text>
          <text class="tl-label-desc" x="880" y="374" text-anchor="middle">Present state</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
