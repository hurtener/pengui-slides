<!-- Pengui document recipe: quote
     Root MUST be <section class="pengui-section pengui-quote">.
     Structure: <figure class="pengui-quote"> wrapping a <blockquote>
     and <figcaption>. Composer applies break-inside: avoid via
     .pengui-quote so the pull quote stays whole. -->
<!-- @section-meta {"title":"Pull Quote","kind":"quote","narrative":"A display blockquote with attribution. Kept whole across page breaks.","tags":["quote","pullquote","print"]} -->
<section class="pengui-section pengui-quote">
  <figure class="pengui-quote">
    <blockquote class="quote-body">
      A short, punchy quote that earns its space. One or two sentences that you want the reader to pause on.
    </blockquote>
    <figcaption class="quote-attribution">— Attribution, Source</figcaption>
  </figure>
</section>
